{% extends "pedidos/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<header class="top">
    <span class="titulo">Asadero Don Beto</span>
</header>
<div class="app" style="max-width:360px;">
    <h2 style="font-family:'Anton',sans-serif; color:var(--navy); text-transform:uppercase;">Ingresar</h2>
    {% if error %}
    <p style="color:var(--danger); font-size:13px;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; color:var(--navy);">Usuario</label><br>
            <input type="text" name="username" style="width:100%; padding:10px; border:1.5px solid var(--navy); border-radius:4px; margin-top:4px;">
        </div>
        <div style="margin-bottom:16px;">
            <label style="font-size:12px; font-weight:700; color:var(--navy);">Contraseña</label><br>
            <input type="password" name="password" style="width:100%; padding:10px; border:1.5px solid var(--navy); border-radius:4px; margin-top:4px;">
        </div>
        <button class="btn" type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
