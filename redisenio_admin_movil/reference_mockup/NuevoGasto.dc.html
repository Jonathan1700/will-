</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(27, 42, 78, 0.6)"></div>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 44px; height: 5px; border-radius: 3px; background: #CFC3AC; align-self: center"></div>
<div style="display: flex; align-items: center; justify-content: space-between">

</a>
</div>

<div>
<label for="g-fecha" style="display: block; font-size: 13px; font-weight: 600; color: #5F5747; margin-bottom: 6px">Fecha</label>
<input id="g-fecha" type="date" value="2026-09-26" style="width: 100%; height: 52px; border: 1px solid #CFC3AC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #1A1A1A">
</div>

<div>
<label for="g-cat" style="display: block; font-size: 13px; font-weight: 600; color: #5F5747; margin-bottom: 6px">Categoría</label>
<select id="g-cat" style="width: 100%; height: 52px; border: 1px solid #CFC3AC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #1A1A1A">
<option>Pollo</option>
</select>
</div>

<div>
<label for="g-desc" style="display: block; font-size: 13px; font-weight: 600; color: #5F5747; margin-bottom: 6px">Descripción</label>
<input id="g-desc" type="text" placeholder="Ej: 20 pollos, 15 kg de papa" style="width: 100%; height: 52px; border: 1px solid #CFC3AC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #1A1A1A">
</div>

<div>
<label for="g-monto" style="display: block; font-size: 13px; font-weight: 600; color: #5F5747; margin-bottom: 6px">Monto</label>
<div style="display: flex; align-items: center; height: 52px; border: 1px solid #CFC3AC; border-radius: 12px; padding: 0 14px; gap: 8px">
<span style="font-size: 18px; font-weight: 600; color: #5F5747">$</span>
<input id="g-monto" type="text" inputmode="decimal" placeholder="0.00" style="flex-grow: 1; min-width: 0; height: 48px; border: 0; outline: 0; font-size: 18px; font-weight: 600; background: transparent; color: #1A1A1A">
</div>
</div>

<button type="button" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: #F2A63B; color: #1B2A4E; font-size: 15px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 4px">Agregar gasto</button>
</div>

</div>
